name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code
        run: |
          curl -H "Authorization: cpanel vagcruis:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://cloud527.thundercloud.uk:2083/execute/VersionControl/update" \
            --data "repository_root=/home/vagcruis/curacao-rebuild.sazacmedia.uk" \
            --fail \
            --show-error

      - name: Run deployment tasks (.cpanel.yml)
        run: |
          curl -H "Authorization: cpanel vagcruis:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://cloud527.thundercloud.uk:2083/execute/VersionControlDeployment/create" \
            --data "repository_root=/home/vagcruis/curacao-rebuild.sazacmedia.uk" \
            --fail \
            --show-error
