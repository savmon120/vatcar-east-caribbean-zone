# fir_sso module settings.
# Credentials (Client ID, Client Secret) and scopes for the VATSIM provider are
# configured at /admin/config/system/oauth2-client via the oauth2_client config
# entity system. No separate credential schema is required here — the
# oauth2_client module already defines oauth2_client.oauth2_client.* in its own
# config/schema/oauth2_client.schema.yml.
fir_sso.settings:
  type: config_object
  label: 'FIR SSO settings'
  mapping: {}
