ecz_vatsim_auth.login:
  path: '/vatsim/login'
  defaults:
    _controller: '\Drupal\ecz_vatsim_auth\Controller\VatsimAuthController::login'
    _title: 'Login with VATSIM'
  requirements:
    _user_is_logged_in: 'FALSE'

ecz_vatsim_auth.callback:
  path: '/vatsim/callback'
  defaults:
    _controller: '\Drupal\ecz_vatsim_auth\Controller\VatsimAuthController::callback'
    _title: 'VATSIM Callback'
  requirements:
    _access: 'TRUE'